name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
      - name: Check tag matches package.json version
        run: test "v$(jq -r .version package.json)" = "$GITHUB_REF_NAME"
      - name: Install native packages for every target
        # OpenTUI ships its renderer per platform; cross-compiling needs all of them.
        run: bun install --frozen-lockfile --os='*' --cpu='*'
      - run: bun run build:all
      - name: Generate man page
        run: ./dist/yt-data-linux-x64 docs --man > dist/yt-data.1
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/yt-data-* dist/yt-data.1 dist/SHA256SUMS \
            --title "$GITHUB_REF_NAME" --generate-notes
